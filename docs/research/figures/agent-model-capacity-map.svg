<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 648" width="736" height="648" role="img" aria-labelledby="title description">
  <title id="title">Creativity, grounding and deployment by agent role</title>
  <desc id="description">Qualitative estimates as of September 2026. Bubble size and colour indicate personal computer, GPU workstation or hosted frontier service, not proportional resource requirements. Synthesist: Frontier; local 4–32B. Primary generator. Hosted frontier is retained provisionally; its parameter count and exact hardware are unknown. The 4–32B local alternatives are evaluation candidates. Critic Panel: 32B + strong reviewer. Primary independent critique. Workstation placement covers the 32B local seat; a retained strong reviewer may use a hosted service. This is not the full panel hardware budget. Evidence Reviewer: 14–32B. Reviews seed evidence. Newly generated hypothesis premises do not currently receive this review. Extraction: 7–9B. Preserves the seed concepts, relation direction and scope; does not independently validate a new hypothesis. Experiment Designer: 32B start. Creative experiment design after hypothesis selection. Workstation placement reflects the 32B starting candidate. 14B is a lower-cost candidate; 7B an exploratory baseline. Experiment Validator: 8–32B. Reviews the proposed test, not hypothesis truth. Workstation placement budgets for the upper end of the local candidate range; an 8B model may fit a personal computer. A strong reviewer is retained initially and may use a hosted service. Elaborator: ≈7B. Rewrites supplied content and should preserve uncertainty without inventing new scientific claims.</desc>
  <style>svg { color-scheme: light dark; --bg: #ffffff; --fg: #252525; --muted: #606060; --line: #dddddd; --personal: #339cff; --workstation: #e25507; --hosted: #924ff7; }
@media (prefers-color-scheme: dark) { svg { --bg: #181818; --fg: #f3f3f3; --muted: #a4a4a4; --line: #373737; --workstation: #fb6a22; --hosted: #ad7bf9; } }
text { fill: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 400; }
.muted { fill: var(--muted); } .name { font-weight: 500; } .title { font-size: 16px; font-weight: 500; }
.frame { fill: none; stroke: var(--line); } .grid { stroke: var(--line); opacity: .4; }
.tier1 { fill: var(--personal); } .tier2 { fill: var(--workstation); } .tier3 { fill: var(--hosted); }
</style>
